# Nome da aplicação Spring Boot
spring.application.name=mcp-customers-server

# Configurações do servidor MCP — identificação exposta no handshake com clientes MCP
spring.ai.mcp.server.name=customers-mcp-server
spring.ai.mcp.server.version=1.0.0

# Transporte STDIO — comunicação via stdin/stdout para integração com Claude Desktop e outros clientes MCP
spring.ai.mcp.server.transport=stdio

# URL base da legacy customer API (sobrescreva via variável de ambiente LEGACY_API_URL)
app.legacy-api.base-url=${LEGACY_API_URL:http://localhost:3000}

# Token de autenticação da API legada (obrigatório em produção via variável de ambiente API_SERVICE_TOKEN)
app.legacy-api.service-token=${API_SERVICE_TOKEN:}
