# Porta da aplicação (equivalente à porta 3000 do servidor Express no curso JS/TS)
server.port=3000

# Segredo para assinar JWTs (HS256 — mínimo 32 caracteres)
# Sobrescreva via variável de ambiente JWT_SECRET em produção
app.jwt.secret=${JWT_SECRET:minha-chave-secreta-muito-longa-para-hs256-pelo-menos-32-chars}

# Validade do JWT em milissegundos (86400000 ms = 24 horas)
app.jwt.expiration=86400000

# Segredo do header X-Super-Secret para geração de service tokens
# Equivalente à variável SUPER_SECRET do módulo 07 do curso JS/TS
app.super-secret=${SUPER_SECRET:superSecret123}
