server.port=8080
spring.application.name=cognitive-architectures

# Chave da OpenAI — defina via variável de ambiente OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Configurações do ReflectionAgent
agent.reflection.threshold=${REFLECTION_THRESHOLD:0.7}
agent.reflection.max-cycles=${REFLECTION_MAX_CYCLES:3}

# Configurações do ReactAgent
agent.react.max-steps=${REACT_MAX_STEPS:10}
