server.port=8080
spring.application.name=agent-loop-framework
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.openai.chat.options.model=gpt-4o-mini
agent.max-steps=${AGENT_MAX_STEPS:10}
agent.max-tokens=${AGENT_MAX_TOKENS:50000}
agent.max-time-seconds=${AGENT_MAX_TIME:120}
agent.no-progress-steps=${AGENT_NO_PROGRESS_STEPS:3}

# Configurações de logging do agente
logging.level.com.iadeva.agent=INFO
logging.level.com.iadeva.agent.core=DEBUG
