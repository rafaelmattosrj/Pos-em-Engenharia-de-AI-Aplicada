# SLF4J SimpleLogger configuration
# Suppress verbose logs from ONNX, Neo4j, and HTTP clients
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.dev.langchain4j=warn
org.slf4j.simpleLogger.log.org.neo4j=warn
org.slf4j.simpleLogger.log.ai.djl=warn
org.slf4j.simpleLogger.log.com.microsoft.onnxruntime=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.levelInBrackets=true
