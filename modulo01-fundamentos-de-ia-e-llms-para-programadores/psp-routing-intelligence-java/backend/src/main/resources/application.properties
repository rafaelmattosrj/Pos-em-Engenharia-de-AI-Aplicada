spring.application.name=psp-routing-intelligence
server.port=8080

# LLM via OpenRouter (ver .env.example)
psp-routing.openrouter.api-key=${OPENROUTER_API_KEY:}
psp-routing.openrouter.model=${NLP_MODEL:google/gemma-3-27b-it:free}

# Neo4j (vector store das transacoes historicas)
psp-routing.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
psp-routing.neo4j.user=${NEO4J_USER:neo4j}
psp-routing.neo4j.password=${NEO4J_PASSWORD:password}

logging.level.com.psprouting=INFO
